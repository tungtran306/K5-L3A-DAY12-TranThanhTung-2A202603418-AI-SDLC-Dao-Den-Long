name: Verify Contract & Tests

on:
  push:
    branches: ["**"]
    tags: ["phase-*", "v*"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run build and verification gate
        run: python3 scripts/verify.py
